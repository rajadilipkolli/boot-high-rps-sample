name: boot-high-rps-sample
services:

  postgresqldb:
    image: postgres:18.6-alpine
    hostname: postgresqldb
    container_name: postgresql
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=statsdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d statsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - demo-network

  pgadmin:
    image: dpage/pgadmin4
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    environment:
      - PGADMIN_DEFAULT_EMAIL=pgadmin4@pgadmin.org
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    depends_on:
      postgresqldb:
        condition: service_healthy
    volumes:
      - ./docker_pgadmin_servers.json:/pgadmin4/servers.json
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "/bin/echo 'postgresqldb:5432:*:appuser:secret' > /tmp/pgpassfile && chmod 600 /tmp/pgpassfile && /entrypoint.sh"
    restart: unless-stopped
    networks:
      - demo-network

#  redis:
#    container_name: redis
#    image: 'redis:alpine'
#    extra_hosts: [ 'host.docker.internal:host-gateway' ]
#    ports:
#      - '6379:6379'
#    volumes:
#      - 'redis_data:/data:rw'
#    healthcheck:
#      test: redis-cli ping
#      interval: 3s
#      timeout: 5s
#      retries: 5
#    networks:
#      - demo-network

  app:
    image: boot-high-rps-sample:latest
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - TSID_NODE_COUNT=10
    depends_on:
      - postgresqldb
    networks:
      - demo-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - demo-network

networks:
  demo-network:
    driver: bridge

volumes:
  redis_data:
