worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Docker's embedded DNS — re-resolves 'app' as replicas come and go.
    # valid=5s means nginx re-queries DNS every 5 seconds so new/replaced
    # containers are picked up quickly without a reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream backend {
        # least_conn distributes load by active connections, not source IP.
        # Combine with keepalive so connections are reused across requests.
        least_conn;
        server app:8080;
        keepalive 128;
        keepalive_requests 10000;
        keepalive_timeout  65s;
    }

    server {
        listen 8080;

        # Socket and throughput optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        location / {
            proxy_pass         http://backend;

            # Required so nginx uses keepalive connections to upstream.
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # High-throughput proxy buffer tuning
            proxy_buffering       on;
            proxy_buffer_size     16k;
            proxy_buffers         32 16k;
            proxy_busy_buffers_size 64k;

            # Reasonable timeouts for a high-RPS service.
            proxy_connect_timeout  5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }
}
