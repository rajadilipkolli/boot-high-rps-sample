# Production profile properties (activate with --spring.profiles.active=production)
spring.threads.virtual.enabled=true

# Redis production tuning
spring.data.redis.client-type=lettuce

#spring.data.redis.host=redis
#spring.data.redis.port=6379
# Server tuning hints
server.max-http-request-header-size=16384
server.tomcat.threads.max=100000
server.tomcat.connection-timeout=20000

# Kafka

management.metrics.tags.env=production
# DataSource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgresqldb:5432/statsdb
spring.datasource.username=appuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver


# Lettuce pool (production tuning)
spring.data.redis.lettuce.pool.max-active=2048
spring.data.redis.lettuce.pool.max-wait=1s
spring.data.redis.lettuce.pool.max-idle=1024
spring.data.redis.lettuce.pool.min-idle=50

# JVM production hints (set in container or systemd service)
# Recommended flags: -XX:+UseZGC -Xms1g -Xmx2g -XX:+UseCompressedOops -XX:MaxDirectMemorySize=512m

# Broker Durability
app.kafka.posts-aggregates-topic.partitions=3
app.kafka.posts-aggregates-topic.replication-factor=1
app.kafka.authors-aggregates-topic.partitions=3
app.kafka.authors-aggregates-topic.replication-factor=1
app.kafka.post-comments-aggregates-topic.partitions=3
app.kafka.post-comments-aggregates-topic.replication-factor=1
app.kafka.min-insync-replicas=1

# Security prerequisites (to be provided via environment variables in production)

app.cache.local-max-size=1000000

spring.data.redis.sentinel.master=mymaster
spring.data.redis.sentinel.nodes=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
