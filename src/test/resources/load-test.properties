# Load Test Configuration defaults
# Profile selects the predefined RPS/duration (smoke, normal, high, stress)
profile=smoke

# Target API base URL
baseUrl=http://localhost:8080

# Dataset sizes
authors=100
posts=1000
comments=5000
tags=50
mutablePostPoolSize=50
# deletablePostPoolSize=20000
mutableCommentPoolSize=50
# deletableCommentPoolSize=50000

# Traffic weights (sum should ideally be 100)
readPostWeight=41.0
readCommentsWeight=20.0
readTagPostsWeight=10.0
createCommentWeight=15.0
createPostWeight=8.0
registerAuthorWeight=2.0
postUpdateWeight=1.0
postDeleteWeight=1.0
commentUpdateWeight=1.0
commentDeleteWeight=1.0

# General Load parameters (can be overridden, otherwise inferred from profile)
# targetRps=
# durationMinutes=
# warmupMinutes=

# Assertion thresholds and allowed deltas are inferred from the selected profile.
# Explicit system-property or environment-variable overrides remain supported.
# baseline.throughput=

# Allowed deltas
allowed.throughput.delta.percent=10

# Data directory for CSV feeders
dataDir=target/loadtest-data
dataSeed=2674
